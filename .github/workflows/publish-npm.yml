name: Release

# Release order matters:
# 1. Build and validate the Windows helper from the selected source commit.
# 2. Build and inspect the exact npm tarball without publishing it.
# 3. Publish that tarball to npm.
# 4. Create the GitHub tag and release with the same validated helper artifact.
#
# No public package, tag, or release is created before every build and package
# check succeeds.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.5.1"
        required: true
      source_ref:
        description: "Source ref to build/publish; defaults to tag"
        required: false
      assets_only:
        description: "Only rebuild and replace the GitHub Release helper asset; do not publish npm or edit release state"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}

jobs:
  publish-release:
    if: ${{ !inputs.assets_only }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            throw "package.json version $($pkg.version) does not match release tag $version"
          }

      - name: Build Windows helper
        run: node scripts/build-native.mjs

      - name: Validate Windows helper
        shell: pwsh
        run: |
          $binary = Resolve-Path "prebuilt\windows\windows-bridge.exe"
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Windows helper is not a PE executable: $binary"
          }

      - name: Validate release notes
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $notes = "notes/release-v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          $content = Get-Content $notes -Raw
          if ($content -notmatch '(?m)^## Features$') { throw "Release notes missing ## Features" }
          if ($content -notmatch '(?m)^## Changelog$') { throw "Release notes missing ## Changelog" }
          if ($content -notmatch '(?m)^> ') { throw "Release notes missing a summary quote" }

      - name: Verify version is unpublished
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Git tag $env:RELEASE_TAG already exists." }
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release $env:RELEASE_TAG already exists." }
          npm view "@injaneity/pi-computer-use@$version" version *> $null
          if ($LASTEXITCODE -eq 0) { throw "npm version $version already exists." }

      - name: Run checks
        run: npm test

      - name: Build and verify npm tarball
        shell: pwsh
        run: |
          $packageTarball = (npm pack --ignore-scripts --silent | Select-Object -Last 1)
          node scripts/check-package-assets.mjs $packageTarball
          "PACKAGE_TARBALL=$packageTarball" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish npm package
        shell: pwsh
        run: npm publish "$env:PACKAGE_TARBALL" --access public --provenance

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item prebuilt\windows\windows-bridge.exe release-assets\windows-bridge.exe
          $hash = (Get-FileHash release-assets\windows-bridge.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("release-assets\SHA256SUMS", "$hash *windows-bridge.exe`n")

      - name: Create GitHub tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh release create "$env:RELEASE_TAG" `
            --target "$env:SOURCE_REF" `
            --title "$env:RELEASE_TAG" `
            --notes-file "notes/release-v$version.md" `
            release-assets\windows-bridge.exe release-assets\SHA256SUMS
          $expected = @('SHA256SUMS', 'windows-bridge.exe') | Sort-Object
          $actual = (gh release view "$env:RELEASE_TAG" --json assets --jq '.assets[].name') | Sort-Object
          if (Compare-Object $expected $actual) { throw "GitHub Release asset set does not match expected files." }

  update-github-release-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.assets_only }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Windows helper
        run: node scripts/build-native.mjs

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item prebuilt\windows\windows-bridge.exe release-assets\windows-bridge.exe
          $hash = (Get-FileHash release-assets\windows-bridge.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("release-assets\SHA256SUMS", "$hash *windows-bridge.exe`n")

      - name: Replace assets on existing GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$env:RELEASE_TAG" release-assets\windows-bridge.exe release-assets\SHA256SUMS --clobber
          $expected = @('SHA256SUMS', 'windows-bridge.exe') | Sort-Object
          $actual = (gh release view "$env:RELEASE_TAG" --json assets --jq '.assets[].name') | Sort-Object
          if (Compare-Object $expected $actual) { throw "GitHub Release asset set does not match expected files." }
