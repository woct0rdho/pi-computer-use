name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run checks
        run: npm test

      - name: Check commit messages
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:commits

  windows-native:
    name: Windows native helper
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/windows/bridge-rs

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test Windows helper
        run: cargo test --locked -j1

      - name: Build Windows helper
        run: node ../../scripts/build-native.mjs

      - name: Validate Windows helper
        shell: pwsh
        run: |
          $binary = Resolve-Path "..\..\prebuilt\windows\windows-bridge.exe"
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Windows helper is not a PE executable: $binary"
          }
          Write-Host "Validated Windows helper at $binary"
